<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joining the server…</title>
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        background: none;
        padding: 0;
      }
      .spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 4px solid var(--surface-alt);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.5;
      }
      .error {
        display: none;
      }
      .error .spinner {
        display: none;
      }
      .error h1 {
        color: var(--danger);
      }
      a.retry {
        display: inline-block;
        margin-top: 16px;
        color: #fff;
        background: var(--accent);
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
      }
      a.retry:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="card" id="loading">
      <div class="spinner"></div>
      <h1>Getting your invite ready…</h1>
      <p>You'll be redirected to our Discord server in a moment.</p>
    </div>
    <div class="card error" id="error">
      <h1>Couldn't create an invite</h1>
      <p>Something went wrong on our end. Please try again in a moment.</p>
      <a class="retry" href="/join">Try again</a>
    </div>
    <script>
      (async () => {
        try {
          const res = await fetch("/join/invite");
          if (!res.ok) throw new Error("bad response");
          const { url } = await res.json();
          window.location.replace(url);
        } catch (err) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
        }
      })();
    </script>
  </body>
</html>
