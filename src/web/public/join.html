<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joining the server…</title>
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        background: none;
        padding: 0;
      }
      .spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 4px solid var(--surface-alt);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.5;
      }
      .error {
        display: none;
      }
      .error .spinner {
        display: none;
      }
      .error h1 {
        color: var(--danger);
      }
      a.retry {
        display: inline-block;
        margin-top: 16px;
        color: #fff;
        background: var(--accent);
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
      }
      a.retry:hover {
        background: var(--accent-hover);
      }
      .card.captcha p.reason {
        margin-bottom: 16px;
      }
      #captcha-container {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="card" id="loading">
      <div class="spinner"></div>
      <h1>Getting your invite ready…</h1>
      <p>You'll be redirected to our Discord server in a moment.</p>
    </div>
    <div class="card captcha" id="captcha" style="display: none">
      <h1>One more step</h1>
      <p class="reason" id="captcha-reason"></p>
      <div id="captcha-container"></div>
    </div>
    <div class="card error" id="error">
      <h1>Couldn't create an invite</h1>
      <p id="error-message">Something went wrong on our end. Please try again in a moment.</p>
      <a class="retry" href="/join">Try again</a>
    </div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
      (function () {
        // Path is /join/:guildId — this same static file is served for
        // every guild, so the guild is read from the URL rather than
        // hardcoded.
        var guildId = window.location.pathname.split("/")[2];
        // Forwards ?ref=<source> from the join link (e.g. /join/123?ref=twitter)
        // so the server can log where this visit came from.
        var ref = new URLSearchParams(window.location.search).get("ref");
        var refSuffix = ref ? "ref=" + encodeURIComponent(ref) : "";
        var inviteUrl = "/join/" + guildId + "/invite";

        function showError(message) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("captcha").style.display = "none";
          document.getElementById("error-message").textContent =
            message || "Something went wrong on our end. Please try again in a moment.";
          document.getElementById("error").style.display = "block";
        }

        function withQuery(extra) {
          var parts = [refSuffix, extra].filter(Boolean);
          return inviteUrl + (parts.length ? "?" + parts.join("&") : "");
        }

        // Same private-IP fallback as verify.ts's detectingIpPage: ask the
        // browser for its own public IP so the server (which only sees a
        // private one, e.g. behind a reverse proxy in local dev) can run
        // the GeoIP/VPN check against it instead.
        function detectClientIp() {
          return new Promise(function (resolve) {
            var timeout = setTimeout(function () { resolve(null); }, 5000);
            fetch("https://api.ipify.org?format=json")
              .then(function (res) { return res.json(); })
              .then(function (data) {
                clearTimeout(timeout);
                resolve(data && data.ip ? data.ip : null);
              })
              .catch(function () {
                clearTimeout(timeout);
                resolve(null);
              });
          });
        }

        function showCaptcha(reason, siteKey) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("captcha-reason").textContent = reason;
          document.getElementById("captcha").style.display = "block";

          function render() {
            window.turnstile.render("#captcha-container", {
              sitekey: siteKey,
              callback: function (token) {
                submitCaptcha(token);
              },
            });
          }
          if (window.turnstile) {
            render();
          } else {
            // Script tag is async — poll briefly until it's ready.
            var wait = setInterval(function () {
              if (window.turnstile) {
                clearInterval(wait);
                render();
              }
            }, 100);
          }
        }

        function submitCaptcha(captchaToken) {
          fetch(withQuery(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ captchaToken: captchaToken }),
          })
            .then(handleResponse)
            .catch(function () { showError(); });
        }

        function handleResponse(res) {
          return res.json().then(function (body) {
            if (res.ok && body.url) {
              window.location.replace(body.url);
              return;
            }
            if (res.status === 200 && body.needsClientIp) {
              return detectClientIp().then(function (ip) {
                var extra = ip ? "clientIp=" + encodeURIComponent(ip) : "";
                return fetch(withQuery(extra)).then(handleResponse);
              });
            }
            if (res.status === 403 && body.requireCaptcha) {
              showCaptcha(body.reason || "Please complete a quick verification challenge to continue.", body.siteKey);
              return;
            }
            showError(body.error);
          });
        }

        fetch(withQuery()).then(handleResponse).catch(function () { showError(); });
      })();
    </script>
  </body>
</html>
